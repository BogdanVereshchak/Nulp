<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenSCAD Modern UI</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="./assets/favicon.ico"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body data-theme="dracula">

    <div class="sidebar">
        <div class="icon-btn active" id="btn-explorer" data-action="switchPanel" data-target="explorer" title="Провідник"><i class="fas fa-copy"></i></div>
        <div class="icon-btn" id="btn-search" data-action="switchPanel" data-target="search" title="Пошук"><i class="fas fa-search"></i></div>
        <div class="icon-btn" id="btn-git" data-action="switchPanel" data-target="git" title="Контроль версій"><i class="fas fa-code-branch"></i></div>
        <div class="spacer"></div>
        <div class="icon-btn" data-action="openModal" data-target="settings" title="Налаштування"><i class="fas fa-cog"></i></div>
        <div class="icon-btn" data-action="openModal" data-target="profile" title="Профіль"><i class="fas fa-user-circle"></i></div>
    </div>

    <div class="side-panel" id="sidePanel">
        <div id="view-explorer" class="panel-view" style="display:flex; flex-direction:column; height:100%;">
            <div class="panel-header">
                <span>Провідник</span>
                <div class="dropdown-wrapper">
                    <i class="fas fa-ellipsis-h" id="explorerMenuBtn" style="cursor:pointer; padding:5px;"></i>
                    <div id="explorerMenu" class="dropdown-menu">
                        <div class="menu-item" id="btn-new-file"><i class="fas fa-plus"></i> Новий файл</div>
                        <div class="menu-item" id="btn-new-folder"><i class="fas fa-folder-plus"></i> Нова папка</div>
                        <div class="menu-item" id="btn-del-file" style="color:var(--error);"><i class="fas fa-trash"></i> Видалити файл</div>
                    </div>
                </div>
            </div>
            <div class="file-list" id="fileList"></div>
        </div>

        <div id="view-search" class="panel-view" style="display:none; flex-direction:column; height:100%;">
            <div class="panel-header">Пошук</div>
            <div class="search-box">
                <input type="text" class="search-input" id="searchInput" placeholder="Шукати у файлах...">
            </div>
            <div class="file-list" id="searchResults"></div>
        </div>

        <div id="view-git" class="panel-view" style="display:none; flex-direction:column; height:100%;">
            <div class="panel-header">Source Control</div>
            <div style="padding:20px; text-align:center; color:var(--text-dim); font-size:12px;">
                <i class="fas fa-check-circle" style="font-size:40px; margin-bottom:10px;"></i><br>
                Немає змін.<br>Робоче дерево чисте.
            </div>
        </div>
    </div>

    <div class="workspace">
        <div class="tabs" id="tabsContainer"></div>

        <div class="split-container">
            <div class="editor-wrapper">
                <div class="line-numbers" id="lineNumbers">1</div>
                <textarea class="code-input" id="codeEditor" spellcheck="false"></textarea>
            </div>

            <div class="preview-area">
                <div class="preview-toolbar">
                    <button class="btn" id="btn-reset-view"><i class="fas fa-compress-arrows-alt"></i> Reset</button>
                    <button class="btn" id="btn-toggle-grid"><i class="fas fa-border-all"></i> Grid</button>
                    <button class="btn" id="btn-toggle-wire"><i class="fas fa-cube"></i> Wireframe</button>
                    <div class="spacer"></div>
                    <button class="btn btn-primary" id="btn-render" title="F5"><i class="fas fa-play"></i> Render</button>
                </div>
                <div id="canvasContainer" style="width: 100%; height: 100%; position: relative;"></div>
                <div id="renderStatus" style="position:absolute; bottom:10px; right:10px; background:rgba(0,0,0,0.7); color:white; padding:5px 10px; border-radius:4px; font-size:12px; display:none;"></div>
            </div>
        </div>

        <div class="console" id="consolePanel">
            <div class="console-header" id="consoleHeader">
                <span><i class="fas fa-terminal"></i> Console / Output</span>
                <span><i class="fas fa-eraser" id="btn-clear-log"></i> <i class="fas fa-chevron-down"></i></span>
            </div>
            <div class="console-body" id="consoleLog">
                <div class="log-line">> OpenSCAD Modern UI v2.0 Loaded.</div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modal-settings">
        <div class="modal">
            <div class="modal-header">
                <span>Налаштування</span>
                <span class="close-btn" data-action="closeModal" data-target="settings" style="cursor:pointer"><i class="fas fa-times"></i></span>
            </div>
            <div class="modal-body">
                <div class="form-row">
                    <label>Тема оформлення</label>
                    <select id="themeSelect">
                        <option value="dracula">Dracula (Default)</option>
                        <option value="light">Light (Світла)</option>
                        <option value="monokai">Monokai (Темна)</option>
                        <option value="oceanic">Oceanic (Синя)</option>
                    </select>
                </div>
                <div class="form-row">
                    <label>Розмір шрифту редактора</label>
                    <input type="number" id="fontSizeInput" value="14">
                </div>
            </div>
            <div class="modal-footer" style="padding:15px; border-top:1px solid var(--border); display:flex; justify-content:flex-end;">
                <button class="btn" data-action="closeModal" data-target="settings">Закрити</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modal-profile">
        <div class="modal">
            <div class="modal-header">
                <span>Профіль користувача</span>
                <span class="close-btn" data-action="closeModal" data-target="profile" style="cursor:pointer"><i class="fas fa-times"></i></span>
            </div>
            <div class="modal-body">
                <div class="user-profile">
                    <div class="avatar"><i class="fas fa-user-astronaut"></i></div>
                    <h3>Student User</h3>
                    <p style="color:var(--text-dim); font-size:12px;">student@lpnu.ua</p>
                </div>
            </div>
            <div class="modal-footer" style="padding:15px; border-top:1px solid var(--border); display:flex; justify-content:flex-end;">
                <button class="btn btn-primary" data-action="closeModal" data-target="profile">OK</button>
            </div>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
