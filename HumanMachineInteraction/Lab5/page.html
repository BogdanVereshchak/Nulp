<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenSCAD Modern UI (Functional)</title>
    <!-- Іконки -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Шрифт -->
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <!-- Three.js (3D Engine) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <style>
        /* CSS змінні для тем */
        :root {
            --bg-dark: #1e1e2e;
            --bg-panel: #252537;
            --bg-sidebar: #181825;
            --accent: #bd93f9;
            --text-main: #f8f8f2;
            --text-dim: #6272a4;
            --border: #44475a;
            --success: #50fa7b;
            --error: #ff5555;
            --scroll-thumb: #44475a;
        }

        /* LIGHT THEME */
        [data-theme="light"] {
            --bg-dark: #ffffff;
            --bg-panel: #f3f4f6;
            --bg-sidebar: #e5e7eb;
            --accent: #2563eb;
            --text-main: #1f2937;
            --text-dim: #6b7280;
            --border: #d1d5db;
            --success: #059669;
            --error: #dc2626;
            --scroll-thumb: #9ca3af;
        }

        /* MONOKAI THEME */
        [data-theme="monokai"] {
            --bg-dark: #272822;
            --bg-panel: #1e1f1c;
            --bg-sidebar: #171814;
            --accent: #a6e22e;
            --text-main: #f8f8f2;
            --text-dim: #75715e;
            --border: #49483e;
            --success: #a6e22e;
            --error: #f92672;
            --scroll-thumb: #49483e;
        }

        /* OCEANIC THEME */
        [data-theme="oceanic"] {
            --bg-dark: #0f111a;
            --bg-panel: #1a1c25;
            --bg-sidebar: #090b10;
            --accent: #80cbc4;
            --text-main: #eeffff;
            --text-dim: #546e7a;
            --border: #263238;
            --success: #c3e88d;
            --error: #ff5370;
            --scroll-thumb: #37474f;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-dark); color: var(--text-main); height: 100vh; overflow: hidden; display: flex; transition: background 0.3s; }

        /* --- SIDEBAR --- */
        .sidebar { width: 50px; background: var(--bg-sidebar); display: flex; flex-direction: column; align-items: center; padding: 10px 0; border-right: 1px solid var(--border); z-index: 20; transition: background 0.3s; }
        .icon-btn { color: var(--text-dim); font-size: 20px; margin-bottom: 20px; cursor: pointer; transition: 0.2s; position: relative; width: 100%; text-align: center; padding: 10px 0; }
        .icon-btn:hover, .icon-btn.active { color: var(--accent); background: rgba(128,128,128,0.1); border-left: 3px solid var(--accent); }
        .spacer { flex: 1; }

        /* --- SIDE PANELS --- */
        .side-panel { width: 250px; background: var(--bg-panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; transition: width 0.3s ease, padding 0.3s; overflow: hidden; }
        .side-panel.collapsed { width: 0; border: none; }
        .panel-header { padding: 10px; font-size: 12px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; color: var(--text-dim); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); height: 40px; }
        
        /* Explorer Items */
        .file-list { flex: 1; overflow-y: auto; }
        .file-item { padding: 8px 15px; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 10px; color: var(--text-main); border-left: 2px solid transparent; user-select: none; }
        .file-item:hover { background: var(--border); }
        .file-item.active { background: rgba(128,128,128,0.2); border-left: 2px solid var(--accent); }
        .file-icon { width: 15px; text-align: center; }

        /* Explorer Menu (Dropdown) */
        .dropdown-wrapper { position: relative; }
        .dropdown-menu { 
            position: absolute; top: 20px; right: 0; width: 150px; 
            background: var(--bg-sidebar); border: 1px solid var(--border); 
            border-radius: 4px; display: none; flex-direction: column; 
            z-index: 50; box-shadow: 0 5px 15px rgba(0,0,0,0.5); 
        }
        .dropdown-menu.show { display: flex; }
        .menu-item { padding: 8px 12px; font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 8px; color: var(--text-main); text-transform: none; }
        .menu-item:hover { background: var(--accent); color: var(--bg-dark); }

        /* Search Panel */
        .search-box { padding: 10px; }
        .search-input { width: 100%; background: var(--bg-dark); border: 1px solid var(--border); padding: 8px; color: var(--text-main); border-radius: 4px; }

        /* --- MAIN WORKSPACE --- */
        .workspace { flex: 1; display: flex; flex-direction: column; min-width: 0; }
        
        /* Tabs */
        .tabs { height: 35px; background: var(--bg-dark); display: flex; border-bottom: 1px solid var(--border); overflow-x: auto; }
        .tab { padding: 0 15px; font-size: 13px; display: flex; align-items: center; gap: 8px; background: var(--bg-panel); border-right: 1px solid var(--border); cursor: pointer; user-select: none; min-width: 120px; justify-content: space-between; transition: background 0.2s; }
        .tab.active { background: var(--bg-dark); border-top: 2px solid var(--accent); color: var(--text-main); }
        .close-tab { font-size: 10px; opacity: 0.5; border-radius: 50%; padding: 2px 4px; }
        .close-tab:hover { opacity: 1; background: var(--error); color: white; }

        /* Split View */
        .split-container { flex: 1; display: flex; overflow: hidden; position: relative; }

        /* Code Editor */
        .editor-wrapper { flex: 1; display: flex; flex-direction: column; border-right: 1px solid var(--border); position: relative; background: var(--bg-dark); transition: background 0.3s; }
        .line-numbers { position: absolute; left: 0; top: 0; bottom: 0; width: 40px; background: var(--bg-sidebar); color: var(--text-dim); font-family: 'Fira Code', monospace; font-size: 14px; line-height: 1.5; padding: 10px 5px; text-align: right; border-right: 1px solid var(--border); overflow: hidden; transition: background 0.3s; }
        textarea.code-input { 
            position: absolute; left: 40px; top: 0; right: 0; bottom: 0;
            background: transparent; color: var(--text-main); 
            border: none; padding: 10px; font-family: 'Fira Code', monospace; 
            font-size: 14px; line-height: 1.5; resize: none; z-index: 2; 
            white-space: pre; overflow: auto; tab-size: 4;
        }
        textarea.code-input:focus { outline: none; }

        /* 3D Preview */
        .preview-area { flex: 1; background: #282a36; display: flex; flex-direction: column; position: relative; }
        /* Force dark bg for preview even in light mode for better 3D visibility, or follow theme? Let's follow variable but keep contrast */
        .preview-area { background: var(--bg-sidebar); }

        .preview-toolbar { height: 40px; background: var(--bg-panel); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: flex-end; padding: 0 10px; gap: 10px; }
        .btn { padding: 5px 12px; border-radius: 4px; border: 1px solid var(--border); background: var(--bg-dark); color: var(--text-main); font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 5px; transition: 0.2s; }
        .btn:hover { background: var(--border); }
        .btn-primary { background: var(--accent); color: var(--bg-dark); border: none; font-weight: bold; }
        .btn-primary:hover { opacity: 0.8; }
        
        #renderCanvas { width: 100%; height: 100%; display: block; }

        /* Console */
        .console { height: 150px; background: var(--bg-panel); border-top: 1px solid var(--border); display: flex; flex-direction: column; font-family: 'Fira Code', monospace; font-size: 12px; transition: height 0.3s; }
        .console.collapsed { height: 30px; }
        .console-header { padding: 5px 10px; background: var(--bg-sidebar); border-bottom: 1px solid var(--border); font-size: 11px; font-weight: bold; display: flex; justify-content: space-between; cursor: pointer; }
        .console-body { flex: 1; padding: 10px; overflow-y: auto; color: var(--success); }
        .log-line { margin-bottom: 4px; border-bottom: 1px solid rgba(128,128,128,0.1); padding-bottom: 2px; }
        .log-line.error { color: var(--error); }
        .log-line.info { color: #8be9fd; }

        /* Modals */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 100; backdrop-filter: blur(2px); }
        .modal-overlay.open { display: flex; }
        .modal { background: var(--bg-panel); width: 450px; border-radius: 8px; border: 1px solid var(--border); box-shadow: 0 20px 50px rgba(0,0,0,0.5); overflow: hidden; }
        .modal-header { padding: 15px; border-bottom: 1px solid var(--border); font-weight: bold; display: flex; justify-content: space-between; background: var(--bg-sidebar); color: var(--text-main); }
        .modal-body { padding: 20px; display: flex; flex-direction: column; gap: 15px; color: var(--text-main); }
        .form-row { display: flex; flex-direction: column; gap: 5px; }
        .form-row label { font-size: 12px; color: var(--text-dim); }
        .form-row input, .form-row select { background: var(--bg-dark); border: 1px solid var(--border); color: var(--text-main); padding: 8px; border-radius: 4px; }
        .user-profile { text-align: center; margin-bottom: 10px; }
        .avatar { width: 80px; height: 80px; background: var(--accent); border-radius: 50%; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; font-size: 32px; color: var(--bg-dark); }

    </style>
</head>
<body data-theme="dracula">

    <!-- 1. SIDEBAR -->
    <div class="sidebar">
        <div class="icon-btn active" id="btn-explorer" onclick="switchPanel('explorer')" title="Провідник"><i class="fas fa-copy"></i></div>
        <div class="icon-btn" id="btn-search" onclick="switchPanel('search')" title="Пошук"><i class="fas fa-search"></i></div>
        <div class="icon-btn" id="btn-git" onclick="switchPanel('git')" title="Контроль версій"><i class="fas fa-code-branch"></i></div>
        <div class="spacer"></div>
        <div class="icon-btn" onclick="openModal('settings')" title="Налаштування"><i class="fas fa-cog"></i></div>
        <div class="icon-btn" onclick="openModal('profile')" title="Профіль"><i class="fas fa-user-circle"></i></div>
    </div>

    <!-- 2. SIDE PANELS -->
    <div class="side-panel" id="sidePanel">
        
        <!-- Explorer View -->
        <div id="view-explorer" class="panel-view" style="display:flex; flex-direction:column; height:100%;">
            <div class="panel-header">
                <span>Провідник</span>
                <div class="dropdown-wrapper">
                    <i class="fas fa-ellipsis-h" style="cursor:pointer; padding:5px;" onclick="toggleExplorerMenu()"></i>
                    <div id="explorerMenu" class="dropdown-menu">
                        <div class="menu-item" onclick="createNewFile()"><i class="fas fa-plus"></i> Новий файл</div>
                        <div class="menu-item" onclick="createNewFolder()"><i class="fas fa-folder-plus"></i> Нова папка</div>
                        <div class="menu-item" style="color:var(--error);" onclick="deleteActiveFile()"><i class="fas fa-trash"></i> Видалити файл</div>
                    </div>
                </div>
            </div>
            <div class="file-list" id="fileList">
                <!-- JS генерує файли тут -->
            </div>
        </div>

        <!-- Search View -->
        <div id="view-search" class="panel-view" style="display:none; flex-direction:column; height:100%;">
            <div class="panel-header">Пошук</div>
            <div class="search-box">
                <input type="text" class="search-input" placeholder="Шукати у файлах..." oninput="filterFiles(this.value)">
            </div>
            <div class="file-list" id="searchResults"></div>
        </div>

        <!-- Git View -->
        <div id="view-git" class="panel-view" style="display:none; flex-direction:column; height:100%;">
            <div class="panel-header">Source Control</div>
            <div style="padding:20px; text-align:center; color:var(--text-dim); font-size:12px;">
                <i class="fas fa-check-circle" style="font-size:40px; margin-bottom:10px;"></i><br>
                Немає змін.<br>Робоче дерево чисте.
            </div>
        </div>
    </div>

    <!-- 3. MAIN WORKSPACE -->
    <div class="workspace">
        <!-- Tabs -->
        <div class="tabs" id="tabsContainer">
            <!-- JS генерує вкладки -->
        </div>

        <div class="split-container">
            <!-- CODE EDITOR -->
            <div class="editor-wrapper">
                <div class="line-numbers" id="lineNumbers">1</div>
                <textarea class="code-input" id="codeEditor" spellcheck="false" oninput="updateLineNumbers()"></textarea>
            </div>

            <!-- 3D PREVIEW -->
            <div class="preview-area">
                <div class="preview-toolbar">
                    <button class="btn" onclick="engine.resetView()"><i class="fas fa-compress-arrows-alt"></i> Reset</button>
                    <button class="btn" onclick="engine.toggleGrid()"><i class="fas fa-border-all"></i> Grid</button>
                    <button class="btn" onclick="engine.toggleWireframe()"><i class="fas fa-cube"></i> Wireframe</button>
                    <div class="spacer"></div>
                    <button class="btn btn-primary" onclick="compileAndRender()" title="F5"><i class="fas fa-play"></i> Render</button>
                </div>
                <div id="canvasContainer" style="width: 100%; height: 100%; position: relative;"></div>
                
                <!-- Overlay message -->
                <div id="renderStatus" style="position:absolute; bottom:10px; right:10px; background:rgba(0,0,0,0.7); color:white; padding:5px 10px; border-radius:4px; font-size:12px; display:none;">
                    Rendered in 0.05s
                </div>
            </div>
        </div>

        <!-- CONSOLE -->
        <div class="console" id="consolePanel">
            <div class="console-header" onclick="toggleConsole()">
                <span><i class="fas fa-terminal"></i> Console / Output</span>
                <span><i class="fas fa-eraser" onclick="clearLog()"></i> <i class="fas fa-chevron-down"></i></span>
            </div>
            <div class="console-body" id="consoleLog">
                <div class="log-line">> OpenSCAD Modern UI v2.0 Loaded.</div>
            </div>
        </div>
    </div>

    <!-- MODALS -->
    
    <!-- Settings Modal -->
    <div class="modal-overlay" id="modal-settings">
        <div class="modal">
            <div class="modal-header">
                <span>Налаштування</span>
                <span class="close-btn" style="cursor:pointer" onclick="closeModal('settings')"><i class="fas fa-times"></i></span>
            </div>
            <div class="modal-body">
                <div class="form-row">
                    <label>Тема оформлення</label>
                    <select id="themeSelect" onchange="changeTheme(this.value)">
                        <option value="dracula">Dracula (Default)</option>
                        <option value="light">Light (Світла)</option>
                        <option value="monokai">Monokai (Темна)</option>
                        <option value="oceanic">Oceanic (Синя)</option>
                    </select>
                </div>
                <div class="form-row">
                    <label>Розмір шрифту редактора</label>
                    <input type="number" value="14" onchange="document.getElementById('codeEditor').style.fontSize = this.value + 'px'">
                </div>
                <div class="form-row">
                    <label>Автозбереження</label>
                    <select><option>Увімкнено</option><option>Вимкнено</option></select>
                </div>
            </div>
            <div class="modal-footer" style="padding:15px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:10px;">
                <button class="btn" onclick="closeModal('settings')">Закрити</button>
            </div>
        </div>
    </div>

    <!-- Profile Modal -->
    <div class="modal-overlay" id="modal-profile">
        <div class="modal">
            <div class="modal-header">
                <span>Профіль користувача</span>
                <span class="close-btn" style="cursor:pointer" onclick="closeModal('profile')"><i class="fas fa-times"></i></span>
            </div>
            <div class="modal-body">
                <div class="user-profile">
                    <div class="avatar"><i class="fas fa-user-astronaut"></i></div>
                    <h3>Student User</h3>
                    <p style="color:var(--text-dim); font-size:12px;">student@lpnu.ua</p>
                </div>
                <div class="form-row">
                    <label>Статус</label>
                    <input type="text" value="Working on Lab 5..." readonly>
                </div>
            </div>
            <div class="modal-footer" style="padding:15px; border-top:1px solid var(--border); display:flex; justify-content:flex-end;">
                <button class="btn btn-primary" onclick="closeModal('profile')">OK</button>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // --- DATA ---
        const files = {
            'main.scad': `// Demo Cube\ncolor("#bd93f9");\ntranslate([0,0,0]);\ncube([20,20,20]);\n\n// Add a sphere\ntranslate([25,0,0]);\ncolor("#50fa7b");\nsphere(r=12);`,
            'parts.scad': `// Cylinder Part\ncolor("#ff79c6");\ncylinder(h=30, r=5);`,
            'config.scad': `// Configuration\n$fn = 60;`
        };
        let activeFile = 'main.scad';
        let openFiles = ['main.scad', 'parts.scad'];

        // --- 1. UI MANAGER ---
        function initUI() {
            renderFileList();
            renderTabs();
            loadFile(activeFile);
            updateLineNumbers();
        }

        function switchPanel(panelId) {
            const sidePanel = document.getElementById('sidePanel');
            const targetView = document.getElementById('view-' + panelId);
            const activeBtn = document.getElementById('btn-' + panelId);
            
            // Якщо панель вже відкрита на цій вкладці - закриваємо
            if (targetView.style.display === 'flex' && !sidePanel.classList.contains('collapsed')) {
                sidePanel.classList.add('collapsed');
                if(activeBtn) activeBtn.classList.remove('active');
                return;
            }

            // Відкриваємо панель
            sidePanel.classList.remove('collapsed');
            
            // Ховаємо всі View
            document.querySelectorAll('.panel-view').forEach(el => el.style.display = 'none');
            document.querySelectorAll('.sidebar .icon-btn').forEach(el => el.classList.remove('active'));
            
            // Показуємо потрібний View
            targetView.style.display = 'flex';
            if(activeBtn) activeBtn.classList.add('active');
        }

        function renderFileList() {
            const list = document.getElementById('fileList');
            list.innerHTML = '';
            Object.keys(files).forEach(filename => {
                const div = document.createElement('div');
                div.className = `file-item ${filename === activeFile ? 'active' : ''}`;
                div.onclick = () => openFile(filename);
                div.innerHTML = `<span class="file-icon"><i class="fas fa-cube"></i></span> ${filename}`;
                list.appendChild(div);
            });
        }

        function toggleExplorerMenu() {
            const menu = document.getElementById('explorerMenu');
            menu.classList.toggle('show');
            // Close on click outside (simple implementation)
            setTimeout(() => {
                document.addEventListener('click', closeMenuOutside, {once:true});
            }, 100);
        }
        
        function closeMenuOutside(e) {
            const menu = document.getElementById('explorerMenu');
            if(!menu.contains(e.target)) menu.classList.remove('show');
        }

        function createNewFile() {
            const name = prompt("Введіть назву файлу:", "new_design.scad");
            if(name) {
                if(files[name]) { alert("Файл вже існує!"); return; }
                files[name] = "// New OpenSCAD File\n";
                openFile(name);
                log(`Файл ${name} створено.`, 'info');
            }
        }

        function createNewFolder() {
            alert("Функція створення папок доступна у Pro версії (емуляція)");
        }

        function deleteActiveFile() {
            if(Object.keys(files).length <= 1) { alert("Не можна видалити останній файл!"); return; }
            if(confirm(`Видалити файл ${activeFile}?`)) {
                delete files[activeFile];
                
                // Закрити вкладку
                const tabIdx = openFiles.indexOf(activeFile);
                if(tabIdx > -1) openFiles.splice(tabIdx, 1);
                
                // Відкрити інший файл
                activeFile = Object.keys(files)[0];
                if(!openFiles.includes(activeFile)) openFiles.push(activeFile);
                
                renderFileList();
                renderTabs();
                loadFile(activeFile);
                log("Файл видалено.", 'info');
            }
        }

        function renderTabs() {
            const container = document.getElementById('tabsContainer');
            container.innerHTML = '';
            openFiles.forEach(filename => {
                const div = document.createElement('div');
                div.className = `tab ${filename === activeFile ? 'active' : ''}`;
                // Клік по вкладці
                div.onclick = (e) => { 
                    if(!e.target.classList.contains('close-tab') && !e.target.parentElement.classList.contains('close-tab')) {
                        openFile(filename); 
                    }
                };
                div.innerHTML = `<span><i class="fas fa-cube"></i> ${filename}</span> <span class="close-tab" onclick="closeTab('${filename}')"><i class="fas fa-times"></i></span>`;
                container.appendChild(div);
            });
        }

        function openFile(filename) {
            // Save current code to memory
            files[activeFile] = document.getElementById('codeEditor').value;
            
            activeFile = filename;
            if(!openFiles.includes(filename)) openFiles.push(filename);
            
            loadFile(filename);
            renderFileList();
            renderTabs();
        }

        function loadFile(filename) {
            const editor = document.getElementById('codeEditor');
            editor.value = files[filename];
            updateLineNumbers();
        }

        function closeTab(filename) {
            const idx = openFiles.indexOf(filename);
            if(idx > -1) {
                openFiles.splice(idx, 1);
                // If we closed the active file, switch to another
                if(activeFile === filename) {
                    activeFile = openFiles[openFiles.length - 1] || Object.keys(files)[0];
                    // Ensure the new active file is open
                    if(openFiles.length === 0 && Object.keys(files).length > 0) {
                        // If no tabs left, just keep current active file logic but no tab? 
                        // Let's force open at least one tab if files exist
                         if(!openFiles.includes(activeFile)) openFiles.push(activeFile);
                    }
                    loadFile(activeFile);
                }
                renderTabs();
            }
        }

        function updateLineNumbers() {
            const editor = document.getElementById('codeEditor');
            const lines = editor.value.split('\n').length;
            document.getElementById('lineNumbers').innerHTML = Array(lines).fill(0).map((_, i) => i + 1).join('<br>');
        }

        function filterFiles(query) {
            const container = document.getElementById('searchResults');
            container.innerHTML = '';
            if(!query) return;
            
            Object.keys(files).forEach(f => {
                if(f.toLowerCase().includes(query.toLowerCase())) {
                    container.innerHTML += `<div class="file-item" onclick="switchPanel('explorer'); openFile('${f}')"><i class="fas fa-file"></i> ${f}</div>`;
                }
            });
        }

        function changeTheme(themeName) {
            document.body.setAttribute('data-theme', themeName);
            log(`Тему змінено на ${themeName}`, 'info');
            
            // Update 3D background if needed
            if(engine) {
                const colors = {
                    'dracula': 0x282a36,
                    'light': 0xf3f4f6,
                    'monokai': 0x272822,
                    'oceanic': 0x1a1c25
                };
                engine.scene.background = new THREE.Color(colors[themeName]);
            }
        }

        // Modals
        function openModal(id) { document.getElementById('modal-' + id).classList.add('open'); }
        function closeModal(id) { document.getElementById('modal-' + id).classList.remove('open'); }

        // Console
        function log(msg, type='') {
            const c = document.getElementById('consoleLog');
            c.innerHTML += `<div class="log-line ${type}">> ${msg}</div>`;
            c.scrollTop = c.scrollHeight;
        }
        function clearLog() { document.getElementById('consoleLog').innerHTML = ''; }
        function toggleConsole() {
            document.getElementById('consolePanel').classList.toggle('collapsed');
        }

        // --- 2. 3D ENGINE (Three.js Wrapper) ---
        class OpenSCADEngine {
            constructor() {
                this.container = document.getElementById('canvasContainer');
                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(0x282a36); // Default Dracula bg
                
                this.camera = new THREE.PerspectiveCamera(45, this.container.clientWidth / this.container.clientHeight, 0.1, 1000);
                this.camera.position.set(50, 50, 50);
                this.camera.lookAt(0, 0, 0);

                this.renderer = new THREE.WebGLRenderer({ antialias: true });
                this.renderer.setSize(this.container.clientWidth, this.container.clientHeight);
                this.container.appendChild(this.renderer.domElement);

                // Controls
                this.controls = new THREE.OrbitControls(this.camera, this.renderer.domElement);
                this.controls.enableDamping = true;

                // Lighting
                const ambientLight = new THREE.AmbientLight(0x404040, 2);
                this.scene.add(ambientLight);
                const dirLight = new THREE.DirectionalLight(0xffffff, 1);
                dirLight.position.set(10, 20, 10);
                this.scene.add(dirLight);

                // Helpers
                this.grid = new THREE.GridHelper(100, 100, 0x44475a, 0x44475a);
                this.scene.add(this.grid);
                this.axes = new THREE.AxesHelper(10);
                this.scene.add(this.axes);

                // Group for user objects
                this.modelGroup = new THREE.Group();
                this.scene.add(this.modelGroup);

                // Resize handler
                window.addEventListener('resize', () => this.onWindowResize(), false);
                
                this.animate();
            }

            onWindowResize() {
                this.camera.aspect = this.container.clientWidth / this.container.clientHeight;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(this.container.clientWidth, this.container.clientHeight);
            }

            animate() {
                requestAnimationFrame(() => this.animate());
                this.controls.update();
                this.renderer.render(this.scene, this.camera);
            }

            resetView() {
                this.camera.position.set(50, 50, 50);
                this.camera.lookAt(0, 0, 0);
                this.controls.reset();
            }

            toggleGrid() { this.grid.visible = !this.grid.visible; }
            toggleWireframe() {
                this.modelGroup.children.forEach(mesh => {
                    if(mesh.material) mesh.material.wireframe = !mesh.material.wireframe;
                });
            }

            clearScene() {
                while(this.modelGroup.children.length > 0){ 
                    this.modelGroup.remove(this.modelGroup.children[0]); 
                }
            }

            addMesh(geometry, color, pos=[0,0,0], rot=[0,0,0]) {
                // Ensure color is hex
                const material = new THREE.MeshPhongMaterial({ 
                    color: color, 
                    specular: 0x111111, 
                    shininess: 30,
                    transparent: true,
                    opacity: 0.9
                });
                const mesh = new THREE.Mesh(geometry, material);
                mesh.position.set(pos[0], pos[1], pos[2]);
                mesh.rotation.set(rot[0] * Math.PI/180, rot[1] * Math.PI/180, rot[2] * Math.PI/180);
                this.modelGroup.add(mesh);
            }
        }

        // --- 3. PARSER (Text to 3D) ---
        function parseAndRun(code, engine) {
            engine.clearScene();
            const lines = code.split('\n');
            
            let curColor = "#bd93f9"; // Default accent
            let curTrans = [0,0,0];
            let curRot = [0,0,0];
            let objCount = 0;

            lines.forEach(line => {
                line = line.trim();
                if(line.startsWith('//') || line.length === 0) return;

                if(line.startsWith('color')) {
                    const match = line.match(/color\("(.+?)"\)/);
                    if(match) curColor = match[1];
                }
                else if(line.startsWith('translate')) {
                    const match = line.match(/\[([\d.-]+),\s*([\d.-]+),\s*([\d.-]+)\]/);
                    if(match) curTrans = [parseFloat(match[1]), parseFloat(match[2]), parseFloat(match[3])];
                }
                else if(line.startsWith('cube')) {
                    const match = line.match(/\[([\d.-]+),\s*([\d.-]+),\s*([\d.-]+)\]/);
                    if(match) {
                        const w=parseFloat(match[1]), h=parseFloat(match[2]), d=parseFloat(match[3]);
                        const geo = new THREE.BoxGeometry(w, h, d);
                        engine.addMesh(geo, curColor, curTrans, curRot);
                        objCount++;
                    }
                }
                else if(line.startsWith('sphere')) {
                    const match = line.match(/r=([\d.-]+)/);
                    if(match) {
                        const geo = new THREE.SphereGeometry(parseFloat(match[1]), 32, 32);
                        engine.addMesh(geo, curColor, curTrans, curRot);
                        objCount++;
                    }
                }
                else if(line.startsWith('cylinder')) {
                    const hMatch = line.match(/h=([\d.-]+)/);
                    const rMatch = line.match(/r=([\d.-]+)/);
                    if(hMatch && rMatch) {
                        const geo = new THREE.CylinderGeometry(parseFloat(rMatch[1]), parseFloat(rMatch[1]), parseFloat(hMatch[1]), 32);
                        engine.addMesh(geo, curColor, curTrans, curRot);
                        objCount++;
                    }
                }
            });
            return objCount;
        }

        // --- MAIN ENTRY ---
        let engine;

        window.onload = function() {
            initUI();
            engine = new OpenSCADEngine();
            setTimeout(compileAndRender, 500);
        };

        function compileAndRender() {
            const code = document.getElementById('codeEditor').value;
            log("Compiling...", "info");
            const start = performance.now();
            
            try {
                const count = parseAndRun(code, engine);
                const time = ((performance.now() - start) / 1000).toFixed(3);
                log(`Rendering finished. Objects: ${count}. Time: ${time}s`);
                
                const status = document.getElementById('renderStatus');
                status.innerText = `Rendered: ${count} objs in ${time}s`;
                status.style.display = 'block';
                setTimeout(() => status.style.display = 'none', 3000);
            } catch(e) {
                log("Error: " + e.message, "error");
            }
        }
    </script>
</body>
</html>
