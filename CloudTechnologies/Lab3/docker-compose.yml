version: "3.8"

services:
  db:
    image: postgres:15-bullseye
    environment:
      POSTGRES_DB: myapp_db
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypass
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - backend

  php:
    image: php:8.2-fpm
    volumes:
      - ./app:/var/www/html
    networks:
      - backend
    depends_on:
      - db

  web:
    image: nginx:latest
    ports:
      - "8080:80"
    volumes:
      - ./app:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - backend

volumes:
  db_data:
    driver: local

networks:
  backend:
